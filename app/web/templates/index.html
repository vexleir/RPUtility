<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RP Utility</title>
  <link rel="stylesheet" href="/static/style.css?v={{CACHE_VER}}">
</head>
<body class="index-layout">

  <!-- Top nav -->
  <nav class="topnav">
    <div class="topnav-title">🎭 <span>RP</span> Utility</div>
    <div class="topnav-sub">local-first AI roleplay</div>
    <div class="topnav-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-label" class="muted">Checking…</span>
    </div>
  </nav>

  <div id="banner-container" style="padding: 0 28px; margin-top: 16px;"></div>

  <div class="index-body">

    <!-- ── Left: Sessions ──────────────────────────────────────────── -->
    <div class="sessions-col">
      <h2>Sessions</h2>
      <div class="session-list" id="session-list">
        <div style="display:flex;align-items:center;gap:10px;color:var(--text-muted)">
          <div class="spinner"></div> Loading…
        </div>
      </div>
    </div>

    <!-- ── Right: New Session ─────────────────────────────────────── -->
    <div class="new-session-col">
      <h2>New Session</h2>

      <form id="create-form" autocomplete="off">

        <div class="form-group">
          <label for="session-name">Session Name</label>
          <input type="text" id="session-name" placeholder="e.g. The Crosshaven Affair" required>
        </div>

        <div class="form-group">
          <label for="char-select">Character Card</label>
          <select id="char-select" required>
            <option value="">Loading…</option>
          </select>
          <div class="card-preview hidden" id="card-preview"></div>
        </div>

        <div class="form-group">
          <label for="lorebook-select">Lorebook <span class="dim">(optional)</span></label>
          <select id="lorebook-select">
            <option value="">Loading…</option>
          </select>
          <div class="form-hint">Lorebook entries are triggered by keywords in conversation.</div>
        </div>

        <div class="form-group">
          <label for="model-select">Ollama Model</label>
          <select id="model-select">
            <option value="">Loading models…</option>
          </select>
          <div class="form-hint">Leave blank to use the default model from config.</div>
        </div>

        <div class="form-group">
          <label for="location-input">Starting Location <span class="dim">(optional)</span></label>
          <input type="text" id="location-input" placeholder="e.g. Tallow &amp; Ink Tavern, Crosshaven">
        </div>

        <button type="submit" id="create-btn" class="btn btn-primary" style="width:100%;justify-content:center">
          Create Session →
        </button>

      </form>

    </div>

  </div><!-- end index-body -->

  <!-- ── Library ──────────────────────────────────────────────────────── -->
  <div class="library-section">
    <div class="library-header">
      <h2>Library</h2>
      <div class="library-actions">
        <button class="btn btn-sm" onclick="triggerImport('card')">⬆ Import Card</button>
        <button class="btn btn-sm" onclick="triggerImport('lorebook')">⬆ Import Lorebook</button>
        <button class="btn btn-sm" onclick="reloadAssets()" id="reload-btn" title="Reload cards and lorebooks from disk">↺ Reload</button>
      </div>
    </div>

    <!-- hidden file inputs -->
    <input type="file" id="card-file-input" accept=".json,.png" style="display:none" onchange="uploadFile('card', this)">
    <input type="file" id="lorebook-file-input" accept=".json,.png" style="display:none" onchange="uploadFile('lorebook', this)">

    <div id="library-banner" style="margin-bottom:10px"></div>

    <div class="library-cols">
      <!-- Cards -->
      <div class="library-col">
        <h3>Character Cards</h3>
        <div class="card-library-grid" id="card-library-grid">
          <div class="dim">Loading…</div>
        </div>
      </div>

      <!-- Lorebooks -->
      <div class="library-col">
        <h3>Lorebooks</h3>
        <div class="lorebook-library-list" id="lorebook-library-list">
          <div class="dim">Loading…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Detail Modal ──────────────────────────────────────────────────── -->
  <div id="detail-modal" class="modal-backdrop hidden" onclick="closeModal(event)">
    <div class="modal-box">
      <button class="modal-close" onclick="closeDetailModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="/static/index.js?v={{CACHE_VER}}"></script>
</body>
</html>
